[project]
name = "alap-alap"
version = "1.0.0"
description = "Cloudflare Turnstile Captcha Solver with Camoufox"
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"
authors = [
    { name = "Alap-Alap Team" }
]
keywords = ["captcha", "turnstile", "cloudflare", "solver", "camoufox"]
dependencies = [
    "requests>=2.28",
    "camoufox>=0.5",
    "playwright>=1.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
]

[tool.black]
line-length = 100
target-version = ["py38", "py39", "py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM"]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
