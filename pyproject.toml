[project]
name = "alap-alap"
version = "1.0.0"
description = "Cloudflare Turnstile Captcha Solver with Camoufox"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Alap-Alap Team" }
]
keywords = ["captcha", "turnstile", "cloudflare", "solver", "camoufox"]
dependencies = [
    "requests>=2.31,<3",
    "camoufox>=0.5,<1",
    "playwright>=1.40,<2",
    "rich>=13.0,<16",
    "typer>=0.9,<1",
    "loguru>=0.7,<1",
    "pydantic>=2.0,<3",
    "tenacity>=8.0,<10",
    "pyyaml>=6.0,<7",
    "flask>=3.0,<4",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "black",
    "ruff",
    "pyright",
]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM"]

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "off"
reportMissingImports = false
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
