[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alap-alap"
version = "1.2.0"
description = "Cloudflare Turnstile Captcha Solver with Camoufox"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Alap-Alap Team" }
]
keywords = ["captcha", "turnstile", "cloudflare", "solver", "camoufox"]
dependencies = [
    "requests>=2.31,<3",
    "camoufox>=0.5,<1",
    "playwright>=1.40,<2",
    "rich>=13.0,<16",
    "typer>=0.9,<1",
    "loguru>=0.7,<1",
    "pydantic>=2.0,<3",
    "tenacity>=8.0,<10",
    "pyyaml>=6.0,<7",
    "flask>=3.0,<4",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "black==26.5.1",
    "ruff",
    "pyright",
]

[project.scripts]
alap-alap = "src.cli:app"

[tool.setuptools.packages.find]
include = ["src*"]
namespaces = false

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# Typer's whole API is "call in the default argument", so B008 does not apply.
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "basic"
reportMissingImports = false
reportMissingTypeStubs = false
reportMissingModuleSource = false
# Third-party call sites (Playwright page objects, Camoufox kwargs) are
# intentionally untyped; keep the gate on our own logic errors.
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false
reportUnknownParameterType = false
reportPrivateUsage = false
reportUnusedExpression = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# Integration tests launch a real Camoufox browser, so they are opt-in:
#   pytest -m integration
addopts = "--strict-markers -m 'not integration'"
markers = [
    "integration: end-to-end tests that start a real browser (deselected by default)",
    "slow: tests that take more than a second",
]

[tool.coverage.run]
source = ["src"]
omit = ["*/__pycache__/*", "*/tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
